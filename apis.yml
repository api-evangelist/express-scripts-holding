apis:
- aid: express-scripts-holding:express-scripts-holding-partner-apis
  name: Express Scripts Partner APIs
  description: The partner-facing API estate Express Scripts exposes through its own gateway. The production
    host api.express-scripts.io and the sandbox host api-sandbox.express-scripts.io both answer HTTP 401
    to every anonymous request, including /.well-known/* paths, so the gateway authenticates before it
    routes. Both hosts were discovered in the developer portal's own deployed runtime configuration, where
    they are declared as hsGateway.gateway and apiSandbox.url. No OpenAPI, GraphQL SDL, AsyncAPI, Protobuf
    or WSDL is published for this estate at any anonymously reachable URL.
