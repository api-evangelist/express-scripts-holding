aid: express-scripts-holding
name: Express Scripts Holding
description: 'Express Scripts is a pharmacy benefit management (PBM) company, now part of Cigna''s Evernorth
  Health Services, that processes prescription claims and provides home delivery and specialty pharmacy
  services for clients including health plans, employers and government programs. Express Scripts runs
  a real partner API estate — a production gateway at api.express-scripts.io, a separate sandbox gateway
  at api-sandbox.express-scripts.io, and its own OAuth 2.0 / OpenID Connect authorization server on an
  Express Scripts Okta tenant that serves live discovery documents anonymously. No API contract is published
  publicly: the developer portal renders client-side, its content backend refuses anonymous requests,
  and the portal''s own configuration sets public-specs to false, so specifications are visible only to
  approved partners after sign-in.'
